<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Trajet de la Donnée</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/html5-qrcode.min.js') }}"></script>
</head>

<body>
    <div id="setup-screen" class="glass-panel">
        <h1>Configuration du Routeur</h1>
        <p>Sélectionnez le rôle de cet ordinateur sur le réseau :</p>
        <select id="pc-role">
            <option value="Départ">Rôle : PC 1 - Départ (Expéditeur)</option>
            <script>
                for (let i = 2; i <= 14; i++) {
                    document.write(`<option value="${i}">Rôle : PC Routeur N°${i}</option>`);
                }
            </script>
            <option value="Arrivée">Rôle : PC 15 - Arrivée (Destinataire)</option>
        </select>
        <button id="start-btn">Activer le Routeur</button>
    </div>

    <div id="scanner-screen" class="glass-panel hidden">
        <h2 id="current-role-display">Routeur Actif</h2>

        <div id="scanner-container">
            <div id="reader"></div>
        </div>

        <div id="result-box" class="hidden">
            <h3 id="packet-name"></h3>
            <p id="routing-message"></p>
            <p id="routing-details"></p>
        </div>

        <button id="reset-scanner" class="hidden">Scanner le paquet suivant</button>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const scannerScreen = document.getElementById('scanner-screen');
        const startBtn = document.getElementById('start-btn');
        const roleSelect = document.getElementById('pc-role');
        const currentRoleDisplay = document.getElementById('current-role-display');
        const scannerContainer = document.getElementById('scanner-container');

        let currentRole = "";
        let html5QrcodeScanner = null;
        let isProcessing = false;

        startBtn.addEventListener('click', () => {
            currentRole = roleSelect.value;
            setupScreen.classList.add('hidden');
            scannerScreen.classList.remove('hidden');

            if (currentRole === "Départ") {
                currentRoleDisplay.textContent = "💻 PC 1 - Poste de Départ";
            } else if (currentRole === "Arrivée") {
                currentRoleDisplay.textContent = "🏁 PC 15 - Poste d'Arrivée";
            } else {
                currentRoleDisplay.textContent = "🔄 PC Routeur N°" + currentRole;
            }

            startScanner();
        });

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.pause();
                }

                const data = JSON.parse(decodedText);
                const packetId = data.id;

                fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pc_id: currentRole,
                        packet_id: packetId,
                        packet_name: data.name
                    })
                })
                    .then(response => response.json())
                    .then(result => {
                        displayResult(result);
                    })
                    .catch(error => {
                        console.error('Network Error:', error);
                        displayError("Erreur de connexion au serveur central.");
                    });
            } catch (e) {
                console.error("Format QR incompris", e);
                displayError("Format de QR Code invalide. Pas de données de routage.");
            }
        }

        function displayResult(result) {
            const resBox = document.getElementById('result-box');
            scannerContainer.classList.add('hidden');

            resBox.className = result.status; // success or error
            resBox.classList.remove('hidden');

            document.getElementById('packet-name').textContent = result.packet_name ? "📦 " + result.packet_name : "📡 Routage";

            if (result.arrived) {
                resBox.classList.add('celebration');
                document.getElementById('routing-message').textContent = "🎉 " + result.message + " 🎉";
                createFloatingEmojis();
            } else {
                document.getElementById('routing-message').textContent = result.message;
            }

            document.getElementById('routing-details').textContent = result.details || "";

            const btn = document.getElementById('reset-scanner');
            btn.className = result.status === 'success' ? 'success-btn' : 'error-btn';
            btn.classList.remove('hidden');
        }

        function createFloatingEmojis() {
            const emojis = ['🌟', '🎉', '📦', '✨', '🍔', '🚀'];
            for (let i = 0; i < 30; i++) {
                const emj = document.createElement('div');
                emj.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                emj.className = 'floating-emoji';
                emj.style.left = Math.random() * 100 + 'vw';
                emj.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(emj);

                // Cleanup after animation
                setTimeout(() => {
                    emj.remove();
                }, 3000);
            }
        }


        function displayError(msg) {
            const resBox = document.getElementById('result-box');
            scannerContainer.classList.add('hidden');

            resBox.className = 'error';
            resBox.classList.remove('hidden');
            document.getElementById('packet-name').textContent = "⚠️ Erreur Système";
            document.getElementById('routing-message').textContent = msg;
            document.getElementById('routing-details').textContent = "";

            const btn = document.getElementById('reset-scanner');
            btn.className = 'error-btn';
            btn.classList.remove('hidden');
        }

        document.getElementById('reset-scanner').addEventListener('click', () => {
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('reset-scanner').classList.add('hidden');
            scannerContainer.classList.remove('hidden');

            isProcessing = false;
            if (html5QrcodeScanner) {
                html5QrcodeScanner.resume();
            }
        });

        function onScanFailure(error) { }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 15, qrbox: { width: 250, height: 250 } },
                false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }
    </script>
</body>

</html>
